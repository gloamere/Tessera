- id: research-plan-knowledge
  prompt: 调研竞品后做产品方案，并把最终结论沉淀成知识笔记
  steps:
    - {id: research, depends_on: []}
    - {id: plan, depends_on: [research]}
    - {id: knowledge, depends_on: [research, plan]}
  failure: research
  expected_blocked: [plan, knowledge]
  expected_continues: []
- id: independent-deliverables
  prompt: 独立评审页面视觉，同时整理现有会议笔记
  steps:
    - {id: visual, depends_on: []}
    - {id: notes, depends_on: []}
  parallel: [visual, notes]
  failure: visual
  expected_blocked: []
  expected_continues: [notes]
- id: user-changes-goal
  prompt: 先调研再写方案；调研后用户取消方案，改为只整理证据
  steps:
    - {id: research, depends_on: []}
    - {id: plan, depends_on: [research]}
    - {id: evidence, depends_on: [research]}
  invalidated: [plan]
  expected_continues: [evidence]
