- id: confirmed-and-verified
  items:
    - {id: refresh, scope: host-lifecycle}
  confirmations: {refresh: true}
  executions: {refresh: true}
  verifications: {refresh: true}
  expected: {refresh: succeeded}
- id: confirmation-skipped
  items:
    - {id: enable, scope: host-lifecycle}
  confirmations: {enable: false}
  expected: {enable: skipped}
- id: verification-fails-and-blocks-dependent
  items:
    - {id: install, scope: trusted-install}
    - {id: enable, scope: host-lifecycle, depends_on: [install]}
    - {id: independent, scope: host-lifecycle}
  confirmations: {install: true, enable: true, independent: true}
  executions: {install: true, enable: true, independent: true}
  verifications: {install: false, enable: true, independent: true}
  expected: {install: failed, enable: blocked, independent: succeeded}
- id: repository-and-rollback-stay-plan-only
  items:
    - {id: manifest, scope: repository-structure}
    - {id: trust, scope: trust}
    - {id: rollback, scope: rollback}
  expected: {manifest: plan-only, trust: plan-only, rollback: plan-only}
