name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify tag matches distribution version
        run: >-
          python -c "import os, pathlib, sys;
          expected = 'v' + pathlib.Path('VERSION').read_text(encoding='utf-8').strip();
          actual = os.environ['GITHUB_REF_NAME'];
          sys.exit(0) if actual == expected else
          sys.exit(f'Tag {actual} does not match VERSION ({expected}).')"
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate release contents (POSIX)
        if: runner.os != 'Windows'
        run: sh scripts/check.sh
      - name: Validate release contents (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check.ps1

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --generate-notes
          --title "Tessera $GITHUB_REF_NAME"
