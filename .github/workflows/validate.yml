name: Validate marketplace

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-dev.txt
      - name: Validate marketplace structure
        run: python3 scripts/validate_marketplace.py
      - name: Test admission scoring
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Exercise routing eval runner
        run: >-
          python3 scripts/run_routing_eval.py
          --host claude
          --case direct-small-edit
          --case multi-intent
          --case evaluate-routing
          --adapter-executable python3
          --adapter-arg tests/fixtures/fake_eval_host.py
          --output eval-results/ci-routing.json
      - name: Exercise native invocation evidence contract
        run: >-
          python3 scripts/run_routing_eval.py
          --host claude
          --mode native
          --case multi-intent
          --repeat 3
          --suggest-tuning
          --adapter-executable python3
          --adapter-arg tests/fixtures/fake_eval_host.py
          --output eval-results/ci-native.json
      - name: Validate personal scenario plan
        run: >-
          python3 scripts/run_routing_eval.py
          --host codex
          --mode native
          --cases tests/personal-routing-cases.yaml
          --dry-run
      - name: Resolve capability catalog
        run: >-
          python3 scripts/resolve_capabilities.py
          --host codex
          --installed-plugin tessera-core
          --active-skill piece-router
          --format json
