name: Validate Gloamere plugins

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-platforms:
    name: Complete checks (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
      - name: Install supported Codex CLI
        run: npm install --global @openai/codex@0.145.0
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run complete validation (POSIX)
        if: runner.os != 'Windows'
        run: sh scripts/check.sh
      - name: Run complete validation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Smoke Eval launcher in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./plugins/gloamere-eval/skills/gloamere-skill-eval/scripts/run.ps1 --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke Eval launcher in PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./plugins/gloamere-eval/skills/gloamere-skill-eval/scripts/run.ps1 --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test isolated plugin lifecycle and legacy migration
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test_plugin_lifecycle.ps1 -IncludeLegacyMigration

  validate-python:
    name: Python ${{ matrix.python-version }} (Ubuntu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run complete validation
        run: sh scripts/check.sh

  validate-site:
    name: Brand site (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install site dependencies
        working-directory: website
        run: npm ci
      - name: Build and server-render public routes
        working-directory: website
        run: npm test
      - name: Lint site
        working-directory: website
        run: npm run lint
      - name: Audit site dependencies
        working-directory: website
        run: npm audit --audit-level=high
      - name: Audit production site dependencies
        working-directory: website
        run: npm audit --audit-level=high --omit=dev
