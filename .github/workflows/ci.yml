name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    # Go 门/CLI 在三平台跑测试:填补本机(仅 Windows)无法验证 mac/linux 的空洞。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
