name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    # Go 门/CLI 在三平台跑测试:填补本机(仅 Windows)无法验证 mac/linux 的空洞。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  mjs-checks:
    # 剩余 mjs 校验:codex hooks 配置 + 仓库卫生(BOM/市集一致性)。零第三方依赖。
    # 门与初始化器已移植到 Go;这两个校验后续也可港成 Go 测试。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test "tests/*.test.mjs"
