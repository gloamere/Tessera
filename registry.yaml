version: 1
external:
  - id: superpowers
    kind: plugin-ref
    summary: 代码流程链(brainstorming/TDD/debugging/验证)
    per_platform:
      claude: "claude plugin install superpowers@superpowers-marketplace"
      codex: "M3 择优:codex plugin marketplace add obra/superpowers-marketplace 或 skills symlink 到 ~/.agents/skills"
    trust_ref: superpowers
  - id: agent-reach
    kind: plugin-ref
    summary: 全网搜索调研(17 平台);含机器级 CLI 生态,不收编
    per_platform:
      claude: "已装于 ~/.claude/skills/agent-reach(散装)"
      codex: "M3 评估 symlink 到 ~/.agents/skills"

  # --- 候选后端:未集成。某块拼图要真干活时以独立 CLI/MCP 调用，保持核心插件无常驻进程、无隐式安装。---
  - id: browser-use
    kind: backend-candidate
    summary: Web 自动化后端(浏览器操作手脚);未来 web-execute 类拼图的执行层。
    license: MIT
    status: not-integrated
    per_platform:
      any: "隔离调用:pip install browser-use,子进程/CLI 方式"
  - id: crewAI
    kind: backend-candidate
    summary: 多角色协作后端;未来"多智能体协作"类拼图的编排层。
    license: MIT
    status: not-integrated
    per_platform:
      any: "隔离调用:pip install crewai,子进程方式"

  # --- 候选 MCP 拼图:两端原生支持,值得作 mcp-server 拼图落地(见 serena 试点 + tessera-mcp-piece-kind 决策)---
  - id: playwright-mcp
    kind: mcp-candidate
    summary: 微软官方 Playwright MCP;给 agent Web 能力(MCP 原生,优于 browser-use 子进程)。
    status: not-integrated
    per_platform:
      claude: "claude mcp add playwright -- npx @playwright/mcp@latest"
      codex: "~/.codex/config.toml 加 [mcp_servers.playwright]"
  - id: github-mcp-server
    kind: mcp-candidate
    summary: GitHub 官方 MCP;让 agent 操作仓库/PR/issue。
    status: not-integrated
    per_platform:
      any: "官方 github-mcp-server,按其 README 在两端注册 MCP"
