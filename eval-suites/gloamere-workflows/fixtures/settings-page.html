<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workspace settings</title>
    <style>
      body { color: #777; font: 14px Arial, sans-serif; margin: 12px; }
      .row { display: flex; gap: 6px; margin: 5px 0; }
      .save { background: #8b74d6; color: #aaa; padding: 6px 10px; }
      .danger { color: #d11; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1>Settings</h1>
    <div class="row"><label>Workspace name</label><input value="Northstar"></div>
    <div class="row"><label>Email reports</label><input type="checkbox" checked></div>
    <button class="save">Save</button>
    <button class="danger">Delete workspace</button>
    <p>Changes may take effect later.</p>
  </body>
</html>
