version: 1
adapters:
  - id: superpowers
    source: obra/superpowers
    kind: codex-plugin
    authorization_required: true
    detect:
      paths:
        - ${PROJECT_ROOT}/.codex/skills/superpowers
        - ${PROJECT_ROOT}/.agents/skills/superpowers
        - ${CODEX_HOME}/skills/superpowers
        - ${HOME}/.agents/skills/superpowers
    install:
      method: codex-plugin-marketplace
      instruction: 在 Codex 插件市场搜索 Superpowers 并安装；安装后重启会话。
  - id: markitdown
    source: microsoft/markitdown
    kind: python-cli
    authorization_required: true
    detect:
      command: markitdown
      python_module: markitdown
    install:
      method: pip
      package: markitdown[pdf,docx,pptx]
      instruction: 安装常用文档转换支持；图片 OCR、音频和云服务按需另行授权。
