version: 1
adapters:
  - id: taste-skill
    source: https://github.com/Leonxlnx/taste-skill
    install_name: design-taste-frontend
    role: design-direction-and-visual-audit
    inputs:
      - UI brief
      - docs/ui/TASTE.md
      - current screenshots and target resolution
      - client or frontend implementation constraints
    outputs:
      - one-line design read
      - two or three distinct directions
      - visual risks and anti-patterns
      - screenshot review findings
    use_for:
      - design direction
      - redesign audit
      - anti-generic visual review
    do_not_use_as:
      - game-client component library
      - automatic approval authority
      - motion requirement
    game_client_profile: constrained
