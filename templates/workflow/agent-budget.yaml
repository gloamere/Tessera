version: 1
max_parallel_agents: 3
max_agent_rounds: 3
repeated_error_limit: 2
no_progress_limit: 2
default_reasoning: medium
research:
  quick:
    max_scouts: 1
    max_rounds: 1
    confirmation: not_required
  standard:
    max_scouts: 2
    max_rounds: 2
    confirmation: not_required
  deep:
    max_scouts: 2
    max_rounds: 3
    confirmation: required
