id: growth-ops
kind: skill
summary: 增长运营拼图：以指标、实验和复盘驱动活动及内容运营闭环。
when_to_use:
  - 策划可衡量的增长活动、内容日历或渠道计划
  - 生成运营周报、指标诊断、实验台账和活动复盘
  - 将目标、人群、渠道、排期、预算和埋点连成执行闭环
avoid_when: 企业内部 SOP、供应商与产能管理，或单纯写一段无需运营闭环的文案
platforms: { claude: native, codex: native, gemini: unsupported, domestic: unsupported }
external_deps: []
inspired_by:
  - anthropics/knowledge-work-plugins/marketing
upgrade_policy: notify-only
