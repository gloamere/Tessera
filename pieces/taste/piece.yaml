id: taste
kind: skill
summary: 审美评审拼图:对 UI/视觉/文案做品味判断,阻止套路化、千篇一律的输出。
when_to_use:
  - 评审界面/配色/排版/视觉设计 → 逐维打分给改进方向
  - 判断"这个方案好不好看""有没有设计感"
  - 产出设计/文案前自检:避免 AI 味、模板味、堆砌感
avoid_when: 纯功能正确性问题、无审美维度的任务
platforms: { claude: native, codex: native, gemini: unsupported, domestic: unsupported }
external_deps: []
inspired_by:
  - Leonxlnx/taste-skill      # 给 AI 审美、阻止套路化输出
  - ui-ux-pro-max-skill       # UI/UX 设计智能技能
upgrade_policy: notify-only
