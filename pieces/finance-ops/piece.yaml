id: finance-ops
kind: skill
summary: 财务运营拼图：把预算、对账、月结、现金流和差异分析变成可复核的工作底稿。
when_to_use:
  - 编制或复核预算、滚动预测、现金流与管理报表
  - 银行、总账、明细账或第三方数据对账并解释差异
  - 月结清单、利润表分析和预算实绩差异复盘
avoid_when: 投资建议、税务或审计意见、付款、过账、申报及其它需要持牌判断或执行权限的动作
platforms: { claude: native, codex: native, gemini: unsupported, domestic: unsupported }
external_deps: []
inspired_by:
  - anthropics/knowledge-work-plugins/finance
upgrade_policy: notify-only
