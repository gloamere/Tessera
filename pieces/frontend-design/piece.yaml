id: frontend-design
kind: skill
summary: 前端设计系统拼图：从产品语境生成设计 token、页面结构、UX/响应式/无障碍约束与技术栈实现建议。
when_to_use:
  - 从零设计页面或组件，并建立可执行的设计系统
  - 系统性重构前端视觉、交互状态、响应式或无障碍
  - 为 React/Next.js/Vue/Tailwind/shadcn 等栈检索实现规则
avoid_when: 纯审美评审交给 taste；纯后端、局部功能 Bug、用户研究和转化实验由宿主直接处理
platforms: { claude: native, codex: native, gemini: unsupported, domestic: unsupported }
external_deps: [python3]
source:
