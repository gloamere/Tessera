id: product-planning
kind: skill
summary: 产品策划拼图：用证据、备选方案、成功指标和风险形成可评审的产品决策。
when_to_use:
  - 产品机会分析、需求澄清、PRD、路线图和范围取舍
  - 用户研究综合、竞品分析、产品指标评审和方案压力测试
  - 需要先定方向、再交负责人拍板的产品策划
avoid_when: 已确定方案的代码实施计划、增长活动执行、简单问答或无需权衡的清单
platforms: { claude: native, codex: native, gemini: unsupported, domestic: unsupported }
external_deps: []
inspired_by:
  - anthropics/knowledge-work-plugins/product-management
upgrade_policy: notify-only
