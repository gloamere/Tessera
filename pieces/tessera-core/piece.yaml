id: tessera-core
kind: skill
summary: Claude/Codex 原生 Skills 之上的个人可靠性内核:调用验证、跨宿主诊断、异常路由与可选本地使用记录。
when_to_use:
  - 运行政策分类或原生 Skill 调用验证、比较稳定性、生成失败驱动的边界建议 → tessera-eval
  - 查看跨宿主版本、启用状态、配置漂移与个人使用摘要 → tessera-status / tessera-doctor
  - 模糊、多意图、高风险、不可逆方向或新增能力请求 → piece-router
  - 初始化工作流或安装、升级、启停、卸载、回滚指导 → tessera-setup
  - 查看拼图安装版本、启用状态、生命周期动作与依赖 → tessera-status(skill;Claude 也可用 /tessera-status 命令)
  - 全面体检或逐项确认修复市集/插件/版本/registry/trust/依赖 → tessera-doctor(skill;Claude 也可用 /tessera-doctor 命令)
  - 复跑政策或原生调用案例、查看验证等级、稳定率与错误分类 → tessera-eval(skill;Claude 也可用 /tessera-eval 命令)
  - 日常能力与状态查看 → tessera-status；完整目录兼容入口 → tessera-capabilities
  - 用户要求新增、引入、拆分或设计拼图 → piece-router 加载七级准入量表
avoid_when: 已有明确单一任务或可由宿主直接调用 taste、planner、knowledge-base 等专业 Skill
platforms: { claude: native, codex: native, gemini: unsupported, domestic: unsupported }
external_deps: []
upgrade_policy: notify-only
