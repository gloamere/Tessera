id: tessera-core
kind: skill
summary: Claude/Codex 原生 Skills 之上的轻量评测层，只验证可观察的 Skill 调用与边界稳定性。
when_to_use:
  - 运行、复跑或比较 Tessera 的 policy 分类与原生 Skill 调用评测
  - 检查误调、漏调、多专业 Skill 冲突或调用稳定性
  - 根据稳定复现且可观察的失败生成 Skill description 边界建议
avoid_when: 普通任务、插件生命周期、状态查看、任务规划或宿主原生能力可以直接完成的工作
platforms: { claude: native, codex: native, gemini: unsupported, domestic: unsupported }
external_deps: []
upgrade_policy: notify-only
